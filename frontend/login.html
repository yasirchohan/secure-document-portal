<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureDocs - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">

    <aside class="auth-side">
      <div class="logo">🔒 SecureDocs</div>
      <h2>Get instant answers from your company documents</h2>
      <ul>
        <li>🔐 Encrypted document storage</li>
        <li>👥 Role-based access control</li>
        <li>🤖 AI-powered smart search</li>
      </ul>
    </aside>

    <section class="auth-form">
      <h1>Welcome back</h1>
      <p class="muted">Log in to your account</p>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@company.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') handleLogin()">

      <button class="btn" onclick="handleLogin()">Login</button>
      <p id="error" class="error"></p>
      <p class="muted small">Demo mode: enter any email and password. If the email contains "admin", you get the admin role.</p>
    </section>

  </div>
  <script src="app.js"></script>
</body>
</html>
